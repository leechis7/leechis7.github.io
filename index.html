<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이채강 — 홈페이지가 옮겨졌습니다</title>

    <!-- 정적 호스팅이라 301 을 보낼 수 없어 새로고침으로 넘긴다.
         2초를 준다. 들어온 사람이 "어디로 가는지" 읽을 틈이 있어야 한다.
         구글은 canonical 을 함께 보므로 이전으로 읽는 데 지장이 없다. -->
    <meta http-equiv="refresh" content="2; url=https://leechis.duckdns.org/" />
    <link rel="canonical" href="https://leechis.duckdns.org/" />
    <meta name="description" content="이채강의 개인 홈페이지. 지금 주소는 leechis.duckdns.org 입니다." />

    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #ffffff;
        color: #171717;
        font: 16px/1.7 -apple-system, BlinkMacSystemFont, system-ui,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #ededed; }
      }
      main { max-width: 32rem; text-align: center; }
      h1 { margin: 0 0 1rem; font-size: 1.5rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1.5rem; color: #6b6b6b; }
      @media (prefers-color-scheme: dark) { p { color: #a3a3a3; } }
      a.go {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 0.5rem;
        background: #171717;
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
      }
      @media (prefers-color-scheme: dark) {
        a.go { background: #ededed; color: #0a0a0a; }
      }
      small { display: block; margin-top: 1.5rem; color: #767676; }
    </style>
  </head>
  <body>
    <main>
      <h1>홈페이지가 옮겨졌습니다</h1>
      <p>
        이채강의 개인 홈페이지는 이제
        <strong>leechis.duckdns.org</strong> 에 있습니다. 2초 뒤 자동으로
        넘어갑니다.
      </p>
      <a class="go" href="https://leechis.duckdns.org/">홈페이지로 가기</a>
      <small>
        This page has moved to
        <a href="https://leechis.duckdns.org/">leechis.duckdns.org</a>
      </small>
    </main>
    <script>
      // 새로고침을 막아 둔 브라우저를 위한 뒷받침. 위와 같은 2초를 준다.
      setTimeout(function () {
        location.replace("https://leechis.duckdns.org/");
      }, 2000);
    </script>
  </body>
</html>
